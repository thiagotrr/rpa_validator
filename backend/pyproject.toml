[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rpa-validator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.4",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "google-cloud-firestore>=2.16",
  "jinja2>=3.1",
  "xhtml2pdf>=0.2.16",
  "pytesseract>=0.3.10",
  "pdf2image>=1.17",
  "firebase-admin>=6.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["modelos/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integracao: depende de LibreOffice/Tesseract, dos emuladores do Firebase/Firestore ou de arquivos reais"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
