name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['tarefa/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detectar:
    name: Detectar componentes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.d.outputs.backend }}
      frontend: ${{ steps.d.outputs.frontend }}
      docker: ${{ steps.d.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          [ -f backend/pyproject.toml ] || [ -f backend/requirements.txt ] && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          [ -f frontend/package.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"
          [ -f Dockerfile ] && echo "docker=true" >> "$GITHUB_OUTPUT" || echo "docker=false" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (ruff + pytest)
    needs: detectar
    if: needs.detectar.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependências do sistema (extração)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer tesseract-ocr tesseract-ocr-por poppler-utils
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e .; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff pytest
      - run: ruff check .
      - run: python -m pytest -q

  frontend:
    name: Front-end (test + build)
    needs: detectar
    if: needs.detectar.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test --if-present
      - run: npm run build

  docker:
    name: Docker build (sem publicar)
    needs: detectar
    if: needs.detectar.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sem publicar, com cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rpa-validator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tamanho da imagem
        env:
          LIMITE_MB: ${{ vars.IMAGEM_MAX_MB }}
        run: |
          MB=$(( $(docker image inspect rpa-validator:ci --format '{{.Size}}') / 1024 / 1024 ))
          {
            echo "### Tamanho da imagem: ${MB} MB"
            echo '```'
            docker history rpa-validator:ci --format '{{.Size}}\t{{.CreatedBy}}' | head -15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Tamanho da imagem: ${MB} MB (limite: ${LIMITE_MB:-nao definido})"
          if [ -n "$LIMITE_MB" ] && [ "$MB" -gt "$LIMITE_MB" ]; then
            echo "::error::Imagem de ${MB} MB excede IMAGEM_MAX_MB=${LIMITE_MB}"
            exit 1
          fi

  ci-ok:
    name: CI ok
    if: always()
    needs: [detectar, backend, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Falhar se algum job falhou
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -Eq '"result": "(failure|cancelled)"'; then exit 1; fi
